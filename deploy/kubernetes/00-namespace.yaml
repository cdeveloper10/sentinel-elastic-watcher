apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    # The platform holds credentials for systems that can block traffic. Pod Security admission is set to
    # the strictest profile the workloads actually satisfy — both run non-root with no capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
