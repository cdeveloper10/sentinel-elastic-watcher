# A template. Do not apply this file as it stands, and do not commit the version you fill in.
#
# Two values, and losing either has a different consequence:
#
#   ConnectionStrings__Sentinel  where the platform's own state lives. The role named here should own
#                                sentinel_prod and have rights in no other database — see
#                                deploy/provision-database.sql.
#
#   Secrets__Key                 32 bytes of base64. It encrypts the credentials stored against each
#                                connection: the Elasticsearch password, the SMS gateway's API key, the
#                                security API's token. Lose it and every connection has to be re-entered.
#                                Leak it and whoever has it can decrypt all of them from a database dump.
#
# Generate the key, once, and put it wherever the estate keeps secrets:
#
#   head -c 32 /dev/urandom | base64
#
# Rotating it: move the current value into Secrets__PreviousKeys before setting a new Secrets__Key, or
# every stored credential becomes unreadable the moment the new key is deployed.
#
# In a cluster with External Secrets or Vault, replace this file entirely and let the operator create the
# Secret. It is here so the shape is unambiguous, not as a recommendation to keep secrets in git.

apiVersion: v1
kind: Secret
metadata:
  name: sentinel
  namespace: sentinel
type: Opaque
stringData:
  ConnectionStrings__Sentinel: >-
    Host=postgres.databases.svc.cluster.local;Port=5432;Database=sentinel_prod;Username=sentinel_app;Password=CHANGE_ME;Keepalive=30;Timeout=15;Command Timeout=30;Maximum Pool Size=20

  Secrets__Key: CHANGE_ME_BASE64_OF_32_BYTES
